name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings to gate store submissions.
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - run: npm run check

      - run: npm run zip

      - name: Upload and publish to the Chrome Web Store
        run: npm run publish:cws
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
